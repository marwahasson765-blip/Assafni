name: Build Asaafni APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/Asaafni.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asaafni-APK
          path: dist/Asaafni.apk
          retention-days: 90
